<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore con Frasi Personalizzate (Unici)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            padding: 40px 20px;
            background-color: #f4f7f6;
            color: #333;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 20px;
        }
        label {
            font-size: 1.1rem;
            display: block;
            margin-bottom: 10px;
        }
        input[type="number"] {
            padding: 10px;
            font-size: 1rem;
            width: 80px;
            border: 2px solid #bdc3c7;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 20px;
        }
        button {
            padding: 12px 24px;
            font-size: 1rem;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .risultato {
            margin-top: 30px;
            text-align: left;
        }
        .numero-card {
            display: block;
            background: #e8f5e9;
            padding: 12px 15px;
            margin: 8px 0;
            border-radius: 8px;
            border: 1px solid #c8e6c9;
            font-size: 1.1rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Generatore di Numeri Senza Doppioni</h1>
    
    <label for="quantita">Quanti numeri vuoi estrarre? (Massimo 24)</label>
    <!-- Il massimo è impostato a 24 perché ci sono 24 frasi uniche disponibili -->
    <input type="number" id="quantita" value="3" min="1" max="24">
    
    <br>
    
    <button onclick="generaNumeriCasuali()">Genera</button>
    
    <div class="risultato" id="output"></div>
</div>

<script>
function generaNumeriCasuali() {
    const inputQuantita = document.getElementById('quantita');
    let quantita = parseInt(inputQuantita.value);
    
    if (isNaN(quantita) || quantita < 1) {
        alert("Inserisci un numero valido maggiore di 0");
        return;
    }
    
    // Essendoci solo 24 opzioni, non possiamo estrarne più di 24 uniche
    if (quantita > 24) {
        quantita = 24;
        inputQuantita.value = 24;
    }
    
    const outputDiv = document.getElementById('output');
    outputDiv.innerHTML = ''; 
    
    // Usiamo un Set per salvare solo numeri unici
    const numeriEstratti = new Set();
    
    // Continua a estrarre finché non raggiungiamo la quantità richiesta di numeri DIVERSI
    while (numeriEstratti.size < quantita) {
        const numeroCasuale = Math.floor(Math.random() * 24) + 1;
        numeriEstratti.add(numeroCasuale); // Se il numero esiste già, non viene aggiunto di nuovo
    }
    
    // Trasformiamo i numeri estratti in un elenco ordinato per mostrarli meglio (opzionale)
    const arrayNumeri = Array.from(numeriEstratti).sort((a, b) => a - b);

    // Ciclo per associare le frasi ai numeri estratti
    for (let i = 0; i < arrayNumeri.length; i++) {
        const numeroCasuale = arrayNumeri[i];
        let testoAssociato = "";

        if (numeroCasuale === 1) {
            testoAssociato = "Giulia Arnaboldi(:";
        } else if (numeroCasuale === 2) {
            testoAssociato = "Sofia Carofano";
        } else if (numeroCasuale === 3) {
            testoAssociato = "Simone Cavinato";
        } else if (numeroCasuale === 4) {
            testoAssociato = "Giulia Celebre";
        } else if (numeroCasuale === 5) {
            testoAssociato = "Fabio Chiadroni";
        } else if (numeroCasuale === 6) {
            testoAssociato = "Lavinia De Amicis";
        } else if (numeroCasuale === 7) {
            testoAssociato = "Sofia Domizio";
        } else if (numeroCasuale === 8) {
            testoAssociato = "Benedetta Farisano";
        } else if (numeroCasuale === 9) {
            testoAssociato = "Gabriele Fiorenza";
        } else if (numeroCasuale === 10) {
            testoAssociato = "Nicole Fireira";
        } else if (numeroCasuale === 11) {
            testoAssociato = "Irene Gambale";
        } else if (numeroCasuale === 12) {
            testoAssociato = "Sara Gentili";
        } else if (numeroCasuale === 13) {
            testoAssociato = "Gabriel Macirella";
        } else if (numeroCasuale === 14) {
            testoAssociato = "Adriano Marini):";
        } else if (numeroCasuale === 15) {
            testoAssociato = "Margot Morosini";
        } else if (numeroCasuale === 16) {
            testoAssociato = "Sara Pauluzzi";
        } else if (numeroCasuale === 17) {
            testoAssociato = "Nathan Pignataro";
        } else if (numeroCasuale === 18) {
            testoAssociato = "Gabriele Rossetti";
        } else if (numeroCasuale === 19) {
            testoAssociato = "Gabriele Ruggiero";
        } else if (numeroCasuale === 20) {
            testoAssociato = "Valerio Ruggiero";
        } else if (numeroCasuale === 21) {
            testoAssociato = "Vincenzo Ruggiero";
        } else if (numeroCasuale === 22) {
            testoAssociato = "Andrea Rummler";
        } else if (numeroCasuale === 23) {
            testoAssociato = "Francesca Stella";
        } else if (numeroCasuale === 24) {
            testoAssociato = "Francesco Ventrone";
        }

        const span = document.createElement('span');
        span.className = 'numero-card';
        span.innerText = `🎲 Numero ${numeroCasuale}: ${testoAssociato}`;
        
        outputDiv.appendChild(span);
    }
}
</script>

</body>
</html>
